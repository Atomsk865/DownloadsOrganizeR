<div class="dashboard-module" data-module="system-update" draggable="true">
    <div class="card">
        <div class="card-header d-flex align-items-center">
            <b>System Update</b>
            <span class="hide-toggle" data-module="system-update" title="Hide module"><i class="bi bi-x-circle"></i></span>
            <span class="drag-handle ms-auto"><i class="bi bi-grip-vertical"></i></span>
        </div>
        <div class="card-body p-3">
            <div class="alert alert-info alert-sm mb-3 py-2 px-3" role="alert" style="font-size: 0.9rem;">
                <i class="bi bi-info-circle"></i> Pull the latest updates from GitHub main branch. Config files will be automatically backed up before updating.
            </div>
            
            <div class="d-flex gap-2 mb-3">
                <button id="btn-update-system" class="btn btn-primary btn-sm" type="button" onclick="updateSystem()">
                    <i class="bi bi-cloud-download"></i> Update from GitHub Main
                </button>
                <button class="btn btn-secondary btn-sm" type="button" onclick="loadBackups()">
                    <i class="bi bi-clock-history"></i> View Backups
                </button>
            </div>
            
            <div id="update-status" class="alert d-none py-2 px-3" role="alert" style="font-size: 0.9rem;"></div>
            
            <!-- Config Backups Section -->
            <div id="backups-section" class="d-none mt-4">
                <h6 class="mb-2"><i class="bi bi-archive"></i> Configuration Backups</h6>
                <div id="backups-list" class="mb-3">
                    <!-- Will be populated by JS -->
                </div>
            </div>
            
            <!-- Config Import Modal -->
            <div class="modal fade" id="configImportModal" tabindex="-1" aria-labelledby="configImportModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="configImportModalLabel">Import Configuration</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p class="text-muted mb-3">Select a configuration file to import from backup:</p>
                            <div id="import-file-list">
                                <!-- Will be populated by JS -->
                            </div>
                            <div id="import-status" class="alert d-none mt-3 py-2 px-3" role="alert" style="font-size: 0.9rem;"></div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentBackupTimestamp = null;

async function updateSystem() {
    const btn = document.getElementById('btn-update-system');
    const statusDiv = document.getElementById('update-status');
    
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Updating...';
    
    statusDiv.className = 'alert alert-info py-2 px-3';
    statusDiv.textContent = 'Backing up configs and pulling updates...';
    statusDiv.classList.remove('d-none');
    
    try {
        const response = await fetch('/api/system/update', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            }
        });
        
        const data = await response.json();
        
        if (data.success) {
            statusDiv.className = 'alert alert-success py-2 px-3';
            statusDiv.innerHTML = `
                <strong><i class="bi bi-check-circle"></i> Update Completed!</strong><br>
                <small>Backup created: ${data.backup.timestamp}</small><br>
                <small>Location: ${data.backup.location}</small><br>
                <small>Files backed up: ${data.backup.files.join(', ')}</small><br>
                ${data.service_restarted ? '<small class="text-success">✓ Service restarted successfully</small>' : '<small class="text-warning">⚠ Service restart failed (manual restart may be needed)</small>'}<br>
                <div class="alert alert-warning alert-sm mt-2 mb-0 py-1 px-2" style="font-size: 0.85rem;">
                    <i class="bi bi-exclamation-triangle"></i> ${data.notice}
                </div>
            `;
            
            // Reload backups list
            setTimeout(() => loadBackups(), 1000);
        } else {
            statusDiv.className = 'alert alert-danger py-2 px-3';
            statusDiv.innerHTML = `<strong><i class="bi bi-x-circle"></i> Update Failed</strong><br><small>${data.error}</small>`;
        }
    } catch (error) {
        statusDiv.className = 'alert alert-danger py-2 px-3';
        statusDiv.innerHTML = `<strong><i class="bi bi-x-circle"></i> Error</strong><br><small>${error.message}</small>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cloud-download"></i> Update from GitHub Main';
    }
}

async function loadBackups() {
    const backupsSection = document.getElementById('backups-section');
    const backupsList = document.getElementById('backups-list');
    
    backupsList.innerHTML = '<div class="text-muted"><i class="bi bi-hourglass-split"></i> Loading backups...</div>';
    backupsSection.classList.remove('d-none');
    
    try {
        const response = await fetch('/api/system/backups', {
            headers: {
                'X-CSRFToken': getCsrfToken()
            }
        });
        
        const data = await response.json();
        
        if (data.backups && data.backups.length > 0) {
            backupsList.innerHTML = data.backups.map(backup => `
                <div class="card mb-2">
                    <div class="card-body p-2">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <strong>${backup.date}</strong>
                                <small class="text-muted d-block">Timestamp: ${backup.timestamp}</small>
                                <small class="text-muted">Files: ${backup.files.join(', ')}</small>
                            </div>
                            <button class="btn btn-outline-primary btn-sm" onclick="showImportModal('${backup.timestamp}', ${JSON.stringify(backup.files).replace(/"/g, '&quot;')})">
                                <i class="bi bi-upload"></i> Import
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        } else {
            backupsList.innerHTML = '<div class="text-muted">No backups found.</div>';
        }
    } catch (error) {
        backupsList.innerHTML = `<div class="alert alert-danger alert-sm py-1 px-2">Error loading backups: ${error.message}</div>`;
    }
}

function showImportModal(timestamp, files) {
    currentBackupTimestamp = timestamp;
    const fileListDiv = document.getElementById('import-file-list');
    
    fileListDiv.innerHTML = files.map(file => `
        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="import-file" id="import-${file}" value="${file}">
            <label class="form-check-label" for="import-${file}">
                <strong>${file}</strong>
            </label>
        </div>
    `).join('') + `
        <button class="btn btn-primary btn-sm mt-3" onclick="importConfig()">
            <i class="bi bi-upload"></i> Import Selected
        </button>
    `;
    
    document.getElementById('import-status').classList.add('d-none');
    
    const modal = new bootstrap.Modal(document.getElementById('configImportModal'));
    modal.show();
}

async function importConfig() {
    const selectedFile = document.querySelector('input[name="import-file"]:checked');
    const statusDiv = document.getElementById('import-status');
    
    if (!selectedFile) {
        statusDiv.className = 'alert alert-warning py-2 px-3';
        statusDiv.textContent = 'Please select a file to import.';
        statusDiv.classList.remove('d-none');
        return;
    }
    
    statusDiv.className = 'alert alert-info py-2 px-3';
    statusDiv.textContent = 'Importing configuration...';
    statusDiv.classList.remove('d-none');
    
    try {
        const response = await fetch('/api/system/import-config', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({
                timestamp: currentBackupTimestamp,
                config_file: selectedFile.value
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            statusDiv.className = 'alert alert-success py-2 px-3';
            statusDiv.innerHTML = `
                <strong><i class="bi bi-check-circle"></i> ${data.message}</strong><br>
                <small class="text-warning">${data.notice}</small>
            `;
            
            // Close modal after 2 seconds
            setTimeout(() => {
                bootstrap.Modal.getInstance(document.getElementById('configImportModal')).hide();
                location.reload(); // Reload to show updated config
            }, 2000);
        } else {
            statusDiv.className = 'alert alert-danger py-2 px-3';
            statusDiv.innerHTML = `<strong><i class="bi bi-x-circle"></i> Import Failed</strong><br><small>${data.error}</small>`;
        }
    } catch (error) {
        statusDiv.className = 'alert alert-danger py-2 px-3';
        statusDiv.innerHTML = `<strong><i class="bi bi-x-circle"></i> Error</strong><br><small>${error.message}</small>`;
    }
}

function getCsrfToken() {
    const tokenElement = document.querySelector('meta[name="csrf-token"]');
    return tokenElement ? tokenElement.getAttribute('content') : '';
}
</script>
