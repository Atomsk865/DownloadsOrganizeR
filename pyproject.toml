[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sortnstore"
version = "1.0.0"
description = "Windows file organization service with web dashboard"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Richard Dennett"}]
keywords = ["file-organization", "downloads", "windows", "service", "dashboard"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "flask>=3.0.0",
    "watchdog>=3.0.0",
    "psutil>=5.8.0",
]

[project.optional-dependencies]
gpu = ["gputil>=1.4.0"]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.900",
]

[project.scripts]
sortnstore-service = "SortNStoreService:main"
sortnstore-dashboard = "SortNStoreDashboard:main"
sortnstore-tray = "SortNStoreTrayApp:main"

[tool.pylint.messages_control]
disable = [
    "fixme",
    "missing-docstring",
    "line-too-long",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-locals = 20
max-arguments = 10
max-branches = 15
max-statements = 50

[tool.pylance]
exclude = ["**/*.md", "**/*.markdown", "docs/**", "README*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | \.md$
  | \.markdown$
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["**/*.md", "**/*.markdown", "docs/**"]
